# Free Supabase projects pause after a week without database activity,
# and free Render services sleep after 15 minutes. This job visits the
# /health page every 3 days, which wakes the site and runs a small query.
name: Keep site and database awake

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the health check
        run: |
          curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 30 \
            https://pizza-station-unzn.onrender.com/health
